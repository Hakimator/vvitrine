version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      astro: { patterns: ['astro', '@astrojs/*'] }
      tooling:
        {
          patterns:
            [
              'eslint*',
              '@eslint/*',
              'typescript-eslint',
              'prettier*',
              'vitest',
              '@vitest/*',
              '@playwright/*',
              '@axe-core/*',
            ],
        }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
