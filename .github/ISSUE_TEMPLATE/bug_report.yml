name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the full error message if the build failed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The smallest vvitrine.config.ts and content that show the problem.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Node version, VVitrine version
